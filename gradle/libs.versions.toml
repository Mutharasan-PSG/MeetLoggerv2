[versions]
agp = "8.12.0"
ffmpegAndroid = "1.1.6"
kotlin = "2.2.0"
coreKtx = "1.16.0"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
appcompat = "1.7.1"
lameAndroid = "0.1.0"
material = "1.12.0"
activity = "1.10.1"
